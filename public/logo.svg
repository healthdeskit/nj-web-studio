<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" fill="none">
  <!-- Browser window icon -->
  <rect x="1" y="5" width="34" height="25" rx="3.5" stroke="#1e3a5f" stroke-width="1.75" fill="none"/>
  <!-- Top bar fill -->
  <rect x="1" y="5" width="34" height="8" rx="3.5" fill="#1e3a5f" fill-opacity="0.07"/>
  <line x1="1" y1="13" x2="35" y2="13" stroke="#1e3a5f" stroke-width="1.5" stroke-opacity="0.1"/>
  <!-- Traffic lights -->
  <circle cx="7.5" cy="9" r="1.6" fill="#1e3a5f" fill-opacity="0.28"/>
  <circle cx="13" cy="9" r="1.6" fill="#1e3a5f" fill-opacity="0.18"/>
  <circle cx="18.5" cy="9" r="1.6" fill="#1e3a5f" fill-opacity="0.1"/>
  <!-- Gold growth chart line -->
  <path d="M7 25l6-6 6 4 8-9" stroke="#c9a227" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chart baseline -->
  <line x1="6" y1="27" x2="33" y2="27" stroke="#1e3a5f" stroke-width="1" stroke-linecap="round" stroke-opacity="0.12"/>
  <!-- Monitor stand -->
  <line x1="18" y1="30" x2="18" y2="34" stroke="#1e3a5f" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="12" y1="34" x2="24" y2="34" stroke="#1e3a5f" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.35"/>
  <!-- Vertical divider -->
  <line x1="45" y1="10" x2="45" y2="35" stroke="#1e3a5f" stroke-width="1" stroke-opacity="0.14"/>
  <!-- Wordmark: stacked two-line -->
  <text x="54" y="21" font-family="Georgia, 'DM Serif Display', serif" font-size="14" font-weight="700" fill="#1e3a5f" letter-spacing="1.5">NJ WEB</text>
  <text x="54" y="34" font-family="Georgia, 'DM Serif Display', serif" font-size="9" font-weight="400" fill="#1e3a5f" letter-spacing="4" fill-opacity="0.52">STUDIO</text>
</svg>
